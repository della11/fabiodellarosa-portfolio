<article class="portfolio active" data-page="portfolio">
  <header>
    <h2 class="h2 article-title">Portfolio</h2>
  </header>

  <section class="projects">
    <ul class="filter-list">
      @for (category of categories; track $index) {
      <li class="filter-item">
        <button
          [class.active]="selectedCategory === category"
          (click)="filterProjects(category)"
        >
          {{ category | titlecase }}
        </button>
      </li>
      }
    </ul>

    <div class="filter-select-box">
      <button class="filter-select" data-select (click)="toggleSelectList()">
        <div class="select-value" data-select-value>
          {{ selectedCategory | titlecase }}
        </div>
        <div class="select-icon">
          <i class="bi bi-chevron-down"></i>
        </div>
      </button>

      @if (isSelectListOpen) {
      <ul class="select-list">
        @for (category of categories; track $index) {
        <li class="filter-item">
          <button (click)="selectCategory(category)">{{ category }}</button>
        </li>
        }
      </ul>

      }
    </div>

    <ul class="project-list">
      @for (project of projects; track $index) {
      <li
        class="project-item"
        [class.active]="
          selectedCategory === 'all' || selectedCategory === project.category
        "
      >
        <a href="#">
          <figure class="project-img">
            <div class="project-item-icon-box">
              <i class="bi bi-eye-fill"></i>
            </div>
            <img [src]="project.img" [alt]="project.title" loading="lazy" />
          </figure>
          <h3 class="project-title">{{ project.title }}</h3>
          <p class="project-category">{{ project.category | titlecase }}</p>
        </a>
      </li>

      }
    </ul>
  </section>
</article>
